name: Deploy Bot

on:
  workflow_dispatch:
    inputs:
      bot_name:
        description: 'Bot name'
        required: true
        type: string
      platform:
        description: 'Platform'
        required: true
        type: choice
        options:
          - telegram
          - whatsapp
      runtime:
        description: 'Runtime'
        required: true
        type: choice
        options:
          - node
          - python
      command:
        description: 'Start command'
        required: false
        type: string
        default: 'node bot.js'

  repository_dispatch:
    types: [deploy-bot]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🤖 Bot Deploy Info
        run: |
          echo "═══════════════════════════════════════════"
          echo "  dnsptr77 Bot Manager — Deploy"
          echo "═══════════════════════════════════════════"
          echo "Bot      : ${{ inputs.bot_name || github.event.client_payload.bot_name }}"
          echo "Platform : ${{ inputs.platform || github.event.client_payload.platform }}"
          echo "Runtime  : ${{ inputs.runtime || github.event.client_payload.runtime }}"
          echo "Command  : ${{ inputs.command || github.event.client_payload.command || 'node bot.js' }}"
          echo "Time     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "═══════════════════════════════════════════"

      # Node.js
      - name: Setup Node.js
        if: inputs.runtime == 'node' || github.event.client_payload.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Node)
        if: inputs.runtime == 'node' || github.event.client_payload.runtime == 'node'
        run: npm ci 2>/dev/null || npm install

      - name: Run bot (Node)
        if: inputs.runtime == 'node' || github.event.client_payload.runtime == 'node'
        timeout-minutes: 5
        run: |
          echo "▶ Starting bot..."
          ${{ inputs.command || github.event.client_payload.command || 'node bot.js' }}
        env:
          NODE_ENV: production

      # Python
      - name: Setup Python
        if: inputs.runtime == 'python' || github.event.client_payload.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Python)
        if: inputs.runtime == 'python' || github.event.client_payload.runtime == 'python'
        run: pip install -r requirements.txt 2>/dev/null || true

      - name: Run bot (Python)
        if: inputs.runtime == 'python' || github.event.client_payload.runtime == 'python'
        timeout-minutes: 5
        run: |
          echo "▶ Starting bot..."
          ${{ inputs.command || github.event.client_payload.command || 'python bot.py' }}

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  Deploy finished — Status: ${{ job.status }}"
          echo "═══════════════════════════════════════════"
